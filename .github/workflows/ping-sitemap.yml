name: Ping Google Sitemap

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Google of updated sitemap
        run: |
          curl "https://www.google.com/ping?sitemap=https://sc-connections.github.io/Top-10/sitemap.xml"
