name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Build and Deploy Niche Sites"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if the build workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate root index.html
        run: npm run generate-root-index
      
      # WHY: Create a clean staging directory for Pages deployment.
      # This prevents uploading unwanted files (node_modules, scripts, templates)
      # and eliminates log truncation caused by verbose artifact listings.
      # We only upload the final static site content (pages/) instead of repo root (.).
      - name: Create clean Pages output directory
        run: |
          echo "📦 Creating clean Pages output directory..."
          
          # Create the output directory
          mkdir -p pages
          
          echo "✅ Created pages/ directory"
      
      - name: Copy root index and required assets to Pages directory
        run: |
          echo "📄 Copying root files to pages/..."
          
          # Copy root index.html
          if [ -f "index.html" ]; then
            cp index.html pages/
            echo "  ✅ Copied index.html"
          else
            echo "  ❌ ERROR: index.html not found!"
            exit 1
          fi
          
          # Copy .nojekyll to prevent Jekyll processing
          if [ -f ".nojekyll" ]; then
            cp .nojekyll pages/
            echo "  ✅ Copied .nojekyll"
          fi
          
          # Copy _niches_data.json for reference
          if [ -f "_niches_data.json" ]; then
            cp _niches_data.json pages/
            echo "  ✅ Copied _niches_data.json"
          fi
          
          # Copy templates directory for shared CSS
          if [ -d "templates" ]; then
            cp -r templates pages/
            echo "  ✅ Copied templates/"
          fi
          
          echo "✅ Root files copied successfully!"
      
      - name: Copy niche folders to Pages directory
        run: |
          echo "📁 Copying niche site folders to pages/..."
          
          # Check if _niches_data.json exists
          if [ ! -f "_niches_data.json" ]; then
            echo "❌ ERROR: _niches_data.json not found!"
            echo "❌ Niche sites have not been generated yet."
            exit 1
          fi
          
          # Copy each niche folder
          niche_count=0
          missing_count=0
          while IFS= read -r slug; do
            if [ -n "$slug" ]; then
              if [ -d "$slug" ]; then
                cp -r "$slug" pages/
                echo "  ✅ Copied: $slug/"
                niche_count=$((niche_count + 1))
              else
                echo "  ❌ Missing: $slug/"
                missing_count=$((missing_count + 1))
              fi
            fi
          done < <(node -e "const data = require('./_niches_data.json'); if (Array.isArray(data)) data.forEach(n => console.log(n.slug));")
          
          echo ""
          echo "📊 Summary:"
          echo "   - Niches copied: $niche_count"
          echo "   - Niches missing: $missing_count"
          
          if [ $missing_count -gt 0 ]; then
            echo ""
            echo "⚠️  WARNING: Some niche folders are missing!"
            echo "⚠️  Proceeding with available niches..."
          fi
          
          echo "✅ Niche folders copied: $niche_count"
      
      # WHY: Sanity checks prevent "green deploys" that succeed but publish wrong/empty content.
      # These checks ensure the Pages artifact contains valid site structure before upload.
      - name: Sanity check - Validate Pages directory structure
        run: |
          echo "🔍 Running sanity checks on pages/ directory..."
          
          # Check 1: pages/index.html must exist
          if [ ! -f "pages/index.html" ]; then
            echo "❌ FATAL: pages/index.html is missing!"
            echo "❌ Cannot deploy without root landing page."
            exit 1
          fi
          echo "✅ Check 1: pages/index.html exists"
          
          # Check 2: Verify _niches_data.json contains niches
          if [ -f "pages/_niches_data.json" ]; then
            niches_in_json=$(node -e "const data = require('./pages/_niches_data.json'); console.log(Array.isArray(data) ? data.length : 0);")
            if [ "$niches_in_json" -eq 0 ]; then
              echo "❌ FATAL: _niches_data.json exists but contains 0 niches!"
              echo "❌ Site data is invalid."
              exit 1
            fi
            echo "✅ Check 2: _niches_data.json contains $niches_in_json niche(s)"
          else
            echo "❌ FATAL: _niches_data.json not found in pages/"
            exit 1
          fi
          
          # Check 3: Verify all expected niche folders exist in pages/
          # This validates against the actual data source rather than assuming naming patterns
          missing_niche_folders=0
          while IFS= read -r slug; do
            if [ -n "$slug" ]; then
              if [ ! -d "pages/$slug" ] || [ ! -f "pages/$slug/index.html" ]; then
                echo "  ❌ Missing or incomplete: pages/$slug/"
                missing_niche_folders=$((missing_niche_folders + 1))
              fi
            fi
          done < <(node -e "const data = require('./pages/_niches_data.json'); if (Array.isArray(data)) data.forEach(n => console.log(n.slug));")
          
          if [ $missing_niche_folders -gt 0 ]; then
            echo "❌ FATAL: $missing_niche_folders niche folder(s) missing in pages/"
            echo "❌ Cannot deploy incomplete site structure."
            exit 1
          fi
          echo "✅ Check 3: All $niches_in_json niche folders validated in pages/"
          
          # Check 4: Verify node_modules is NOT in pages/
          if [ -d "pages/node_modules" ]; then
            echo "❌ FATAL: node_modules found in pages/ directory!"
            echo "❌ Build artifacts should not be deployed."
            exit 1
          fi
          echo "✅ Check 4: No node_modules in pages/"
          
          echo ""
          echo "✅ All sanity checks passed!"
          echo "📦 Pages directory is ready for deployment"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # WHY: Upload ONLY the pages/ directory instead of repo root (.).
      # This dramatically reduces artifact size, prevents log truncation,
      # and ensures only final static content is deployed (no source files).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
