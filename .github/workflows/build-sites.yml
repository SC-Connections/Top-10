name: Build and Deploy Niche Sites

on:
  push:
    branches:
      - main
    paths:
      - 'niches.csv'
  workflow_dispatch:
    inputs:
      debug_logs:
        description: 'Enable debug logging (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Run weekly on Monday at 6 AM UTC to update product data
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  build-and-publish-sites:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Puppeteer dependencies
        run: |
          echo "📦 Installing Puppeteer system dependencies..."
          sudo apt-get update -qq

          # Install common dependencies (most runners will have these packages)
          sudo apt-get install -y \
            libx11-xcb1 \
            libxtst6 \
            libxcomposite1 \
            libxi6 \
            libxrender1 \
            libxrandr2 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxss1 \
            libxdamage1 \
            libgbm1 || echo "⚠️  Some Puppeteer dependencies failed to install (non-fatal)"

          # Try sound package variants with explicit fallback handling to support different Ubuntu runner versions
          if sudo apt-get install -y libasound2; then
            echo "✅ Installed libasound2"
          elif sudo apt-get install -y libasound2t64; then
            echo "✅ Installed libasound2t64"
          else
            echo "⚠️  Neither libasound2 nor libasound2t64 could be installed on this runner. Puppeteer may still work depending on the environment."
          fi
      
      - name: Set timestamp
        run: echo "UPDATE_TIMESTAMP=$(date '+%B %d, %Y')" >> $GITHUB_ENV
      
      # Incremental mode on push (new/changed niches only)
      - name: Generate niche sites (incremental)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          AMAZON_AFFILIATE_ID: ${{ secrets.AMAZON_AFFILIATE_ID }}
          UPDATE_TIMESTAMP: ${{ env.UPDATE_TIMESTAMP }}
          SKIP_PUPPETEER: 'false'  # Try to use Puppeteer, but will fallback if it fails
          DEBUG_LOGS: ${{ github.event.inputs.debug_logs || 'false' }}
        run: |
          echo "🚀 Generating niche sites (incremental mode)..."
          echo "📊 Configuration:"
          echo "   - RAPIDAPI_KEY present: ${{ secrets.RAPIDAPI_KEY != '' }}"
          echo "   - AMAZON_AFFILIATE_ID present: ${{ secrets.AMAZON_AFFILIATE_ID != '' }}"
          echo "   - DEBUG_LOGS: ${DEBUG_LOGS}"
          node site-generator.js --mode=incremental
          echo "✅ Site generation complete!"
      
      # Refresh mode on schedule (age-based refresh)
      - name: Generate niche sites (weekly refresh)
        if: github.event_name == 'schedule'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          AMAZON_AFFILIATE_ID: ${{ secrets.AMAZON_AFFILIATE_ID }}
          UPDATE_TIMESTAMP: ${{ env.UPDATE_TIMESTAMP }}
          SKIP_PUPPETEER: 'false'  # Try to use Puppeteer, but will fallback if it fails
          DEBUG_LOGS: 'false'
        run: |
          echo "🚀 Generating niche sites (refresh mode)..."
          echo "📊 Configuration:"
          echo "   - RAPIDAPI_KEY present: ${{ secrets.RAPIDAPI_KEY != '' }}"
          echo "   - AMAZON_AFFILIATE_ID present: ${{ secrets.AMAZON_AFFILIATE_ID != '' }}"
          node site-generator.js --mode=refresh
          echo "✅ Site generation complete!"
      
      - name: Prune empty niches (safe mode)
        id: prune
        run: |
          echo "🧹 Safe pruning: Only removes niches after 3 consecutive failures..."
          echo "📊 Protects against transient errors (blocked, missing_key, api_error, timeout)"
          
          # Run safe pruning script
          if node prune-empty-niches.js; then
            echo "PRUNED=true" >> $GITHUB_OUTPUT
            echo "✅ Pruning completed - changes were made"
          else
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 1 ]; then
              echo "PRUNED=false" >> $GITHUB_OUTPUT
              echo "✅ No empty niches to prune"
            else
              echo "❌ Pruning failed with error"
              exit $EXIT_CODE
            fi
          fi
      
      - name: Verify niche folders were generated
        run: |
          echo "🔍 Verifying generated niche folders..."

          if [ ! -f "_niches_data.json" ]; then
            echo "❌ ERROR: _niches_data.json was not generated!"
            echo "[]" > _niches_data.json
            echo "ℹ️  Created empty _niches_data.json to avoid hard failure."
          fi

          # Check each niche folder
          missing_count=0
          total_niches=0
          while IFS= read -r slug; do
            if [ -n "$slug" ]; then
              total_niches=$((total_niches + 1))
              if [ ! -d "$slug" ] || [ ! -f "$slug/index.html" ]; then
                echo "❌ Missing or incomplete: $slug/"
                missing_count=$((missing_count + 1))
              else
                echo "✅ Verified: $slug/"
              fi
            fi
          done < <(node -e "const data = require('./_niches_data.json'); if (Array.isArray(data)) data.forEach(n => console.log(n.slug));")

          if [ $missing_count -gt 0 ]; then
            echo "⚠️ WARNING: $missing_count of $total_niches niche folder(s) failed to generate."
            echo "⚠️ This is non-fatal: continuing workflow so valid sites can still be published. Check logs above for failed niches."
          else
            echo "✅ All niche folders generated successfully!"
          fi
      
      - name: Generate root index.html
        run: npm run generate-root-index
      
      - name: Commit and push generated sites
        if: steps.prune.outputs.PRUNED == 'true' || success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          # Check if pruning made changes
          if [ "${{ steps.prune.outputs.PRUNED }}" = "true" ]; then
            COMMIT_MSG="chore: prune empty niches and auto-generate sites [$(date '+%Y-%m-%d %H:%M')]"
          else
            COMMIT_MSG="Auto-generate niche sites [$(date '+%Y-%m-%d %H:%M')]"
          fi
          
          git commit -m "$COMMIT_MSG"
          
          # Make sure we integrate any remote changes before pushing
          # Note: If rebase fails due to conflicts, the workflow will fail
          # and require manual intervention to resolve conflicts
          git pull --rebase origin main
          
          git push origin main
      
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Niche sites have been generated and committed to the main branch:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "_niches_data.json" ]; then
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('_niches_data.json', 'utf-8'));
              data.forEach(({ niche, slug, url }) => {
                console.log(\`- **\${niche}**: [\${url}](\${url})\`);
              });
            " >> $GITHUB_STEP_SUMMARY
          fi

